theme:
  name: material
  language: en
  features:
    - navigation.indexes      # section landing pages (partN/index.md)
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    # NOTE: navigation.instant is intentionally OFF — it breaks the language switcher
    #       and stops KaTeX/JS from re-running on page change (ADR-0003).
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search:
      lang:
        - en
        - zh          # Chinese full-text search; Material segments with jieba when installed (ADR-0003)
  - i18n:
      docs_structure: suffix       # page.md = en (default/fallback), page.zh.md = zh translation
      fallback_to_default: true    # missing zh page falls back to the English default
      reconfigure_material: true   # auto-build the top-of-page language switcher
      reconfigure_search: true     # per-language search index
      languages:
        - locale: en
          default: true
          name: English
          build: true
