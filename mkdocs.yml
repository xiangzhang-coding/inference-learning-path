# mkdocs.yml — inference-learning-path
# Architecture rationale: docs/adr/0003-site-architecture.md
# vLLM version policy:     docs/adr/0004-vllm-version-policy.md
#
# The one structural gate (spec Seam A): `mkdocs build --strict`
# strict turns broken links / orphan pages / missing nav / i18n errors into build failures.

site_name: Inference Infra Learning Path
site_description: A bilingual, beginner-friendly path to LLM inference infra — maximizing vLLM concurrency and backend throughput.
site_author: xiangzhang-coding
site_url: https://inference-learning-path.pages.dev/   # Cloudflare Pages root deploy (deferred; see ADR-0003)
repo_url: https://github.com/xiangzhang-coding/inference-learning-path
repo_name: inference-learning-path
copyright: CC BY-SA 4.0

# ADR-0003: repo meta (CONTEXT.md, docs/adr, docs/spec) lives OUTSIDE site_src and is never published.
docs_dir: site_src

# Explicit nav — every page appears exactly once (strict fails on orphans / missing entries).
# Nav titles here are the English source; Chinese titles come from i18n nav_translations below.
nav:
  - Home: index.md
  - "Part 0 · Foundations & Motivation":
      - part0/index.md
      - "Inference Flow: Prefill & Decode": part0/inference-flow.md
      - "Transformer, the Infra View": part0/transformer-infra.md
      - "KV Cache": part0/kv-cache.md
      - "GPU Hardware Mental Model": part0/gpu-hardware.md
      - "Inference Performance Metrics": part0/metrics.md
      - "Number Formats: FP16 to INT4": part0/number-formats.md
  - "Part 1 · Transformer (Infra View)": part1/index.md
  - "Part 2 · Single-GPU Inference Performance":
      - part2/index.md
      - "Operator Roofline: GEMM & Attention Intensity": part2/roofline-analysis.md
      - "KV Cache Memory Math": part2/kv-cache-math.md
      - "FlashAttention (IO-aware)": part2/flash-attention.md
      - "Kernel Fusion & CUDA Graphs": part2/kernel-fusion-cuda-graphs.md
  - "Part 3 · GPU Programming (Triton)": part3/index.md
  - "Part 4 · Quantization": part4/index.md
  - "Part 5 · Serving & Throughput (vLLM Core)": part5/index.md
  - "Part 6 · Advanced Inference Topics": part6/index.md
  - "Part 7 · Multi-GPU & Distributed": part7/index.md
  - "Part 8 · Production & System Design": part8/index.md
  - "Interview Bank":
      - interview/index.md
      - "Prefill vs decode": interview/prefill-vs-decode.md
      - "Attention variants: MHA/MQA/GQA": interview/attention-variants.md
      - "KV cache & throughput ceiling": interview/kv-cache.md
      - "GPU memory hierarchy & roofline": interview/gpu-memory-hierarchy.md
      - "Latency vs throughput metrics": interview/latency-throughput-metrics.md
      - "Number formats & precision": interview/number-formats.md
      - "Arithmetic intensity of GEMM & attention": interview/arithmetic-intensity.md
      - "VRAM budget & max concurrency": interview/vram-capacity-planning.md
      - "FlashAttention & IO-aware attention": interview/flash-attention.md
      - "CUDA graphs & kernel fusion": interview/cuda-graphs-fusion.md
  - "Eval Sets":
      - eval/index.md
      - "Small set (~20)": eval/small.md
      - "Large set": eval/large.md
  - Capstone: capstone/index.md
  - Glossary: glossary.md

theme:
  name: material
  language: en
  features:
    - navigation.indexes      # section landing pages (partN/index.md)
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    # NOTE: navigation.instant is intentionally OFF — it breaks the language switcher
    #       and stops KaTeX/JS from re-running on page change (ADR-0003).
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search:
      lang:
        - en
        - zh          # Chinese full-text search; Material segments with jieba when installed (ADR-0003)
  - i18n:
      docs_structure: suffix       # page.md = en (default/fallback), page.zh.md = zh translation
      fallback_to_default: true    # missing zh page falls back to the English default
      reconfigure_material: true   # auto-build the top-of-page language switcher
      reconfigure_search: true     # per-language search index
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          site_name: LLM 推理 Infra 学习路径
          nav_translations:
            Home: 首页
            "Part 0 · Foundations & Motivation": "Part 0 · 基础与动机"
            "Inference Flow: Prefill & Decode": "推理流程：Prefill 与 Decode"
            "Transformer, the Infra View": "Transformer 的 Infra 视角"
            "KV Cache": "KV 缓存"
            "GPU Hardware Mental Model": "GPU 硬件心智模型"
            "Inference Performance Metrics": "推理性能度量"
            "Number Formats: FP16 to INT4": "数值格式：FP16 到 INT4"
            "Part 1 · Transformer (Infra View)": "Part 1 · Transformer（Infra 视角）"
            "Part 2 · Single-GPU Inference Performance": "Part 2 · 单卡推理性能"
            "Operator Roofline: GEMM & Attention Intensity": "算子 Roofline：GEMM 与 Attention 强度"
            "KV Cache Memory Math": "KV 缓存显存数学"
            "FlashAttention (IO-aware)": "FlashAttention（IO-aware）"
            "Kernel Fusion & CUDA Graphs": "Kernel Fusion 与 CUDA Graphs"
            "Part 3 · GPU Programming (Triton)": "Part 3 · GPU 编程（Triton）"
            "Part 4 · Quantization": "Part 4 · 量化"
            "Part 5 · Serving & Throughput (vLLM Core)": "Part 5 · 服务化与吞吐（vLLM 核心）"
            "Part 6 · Advanced Inference Topics": "Part 6 · 进阶推理专题"
            "Part 7 · Multi-GPU & Distributed": "Part 7 · 多卡与分布式"
            "Part 8 · Production & System Design": "Part 8 · 生产部署与系统设计"
            "Interview Bank": "面试题库"
            "Prefill vs decode": "Prefill vs Decode"
            "Attention variants: MHA/MQA/GQA": "注意力变体：MHA/MQA/GQA"
            "KV cache & throughput ceiling": "KV 缓存与吞吐上限"
            "GPU memory hierarchy & roofline": "GPU 内存层级与 roofline"
            "Latency vs throughput metrics": "延迟与吞吐度量"
            "Number formats & precision": "数值格式与精度"
            "Arithmetic intensity of GEMM & attention": "GEMM 与 attention 的算术强度"
            "VRAM budget & max concurrency": "显存预算与最大并发"
            "FlashAttention & IO-aware attention": "FlashAttention 与 IO-aware attention"
